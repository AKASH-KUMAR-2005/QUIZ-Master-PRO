<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Result</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="student-dashboard.html"><span>Q</span><b>QuizMaster <i>PRO</i></b></a><nav><a href="student-dashboard.html">Dashboard</a><a href="history.html">History</a></nav></header><main class="result"><div class="result-card"><small class="tag">RESULT</small><h1 id="title">Quiz Completed</h1><div class="circle"><b id="pct">0%</b><span id="grade">Grade F</span></div><h2 id="remark"></h2><div class="stats"><div><b id="correct">0</b><span>Correct</span></div><div><b id="wrong">0</b><span>Wrong</span></div><div><b id="skip">0</b><span>Skipped</span></div><div><b id="score">0/0</b><span>Score</span></div></div><div class="actions"><a class="btn primary" href="student-dashboard.html">New Quiz</a><a class="btn ghost" href="history.html">History</a></div></div></main><script>let r=JSON.parse(localStorage.getItem('lastResult')||'null');if(!r)location.href='student-dashboard.html';title.textContent=`Well done, ${r.name}!`;pct.textContent=r.pct+'%';grade.textContent='Grade '+r.grade;remark.textContent=r.remark;correct.textContent=r.correct;wrong.textContent=r.wrong;skip.textContent=r.skip;score.textContent=r.correct+'/'+r.total</script></body></html>

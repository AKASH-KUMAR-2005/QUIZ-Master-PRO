<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login • QuizMaster Pro</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html"><span>Q</span><b>QuizMaster <i>PRO</i></b></a><nav><a href="index.html">Home</a><a href="admin-login.html">Admin</a></nav></header><main class="auth"><div class="auth-card"><small class="tag">STUDENT PORTAL</small><h1>Welcome back</h1><p>Login to start your quiz.</p><label>Student name<input id="name" placeholder="Your full name"></label><label>Student ID<input id="sid" placeholder="e.g. MCA001"></label><label>Password<input id="pass" type="password" placeholder="Enter password"></label><button class="btn primary full" onclick="login()">Login →</button><div id="msg" class="msg"></div><small class="hint">Demo mode: any non-empty Student ID and password will work.</small></div></main><script>function login(){let n=document.getElementById('name').value.trim(),id=document.getElementById('sid').value.trim(),p=document.getElementById('pass').value;if(!n||!id||!p){document.getElementById('msg').textContent='Please fill all fields.';return}localStorage.setItem('student',JSON.stringify({name:n,id:id}));location.href='student-dashboard.html'}</script></body></html>

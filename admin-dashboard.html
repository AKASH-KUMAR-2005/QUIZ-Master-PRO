<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#"><span>Q</span><b>QuizMaster <i>PRO</i></b></a><nav><a href="index.html" onclick="sessionStorage.removeItem('admin')">Logout</a></nav></header><main class="dash"><div class="welcome"><div><small class="tag">ADMIN DASHBOARD</small><h1>Quiz Analytics</h1><p>Monitor student quiz attempts stored on this browser.</p></div></div><section class="admin-stats"><div class="panel"><b id="a">0</b><span>Attempts</span></div><div class="panel"><b id="st">0</b><span>Students</span></div><div class="panel"><b id="av">0%</b><span>Average</span></div></section><div class="panel"><div class="row between"><h2>All Attempts</h2><button class="btn danger" onclick="wipe()">Delete All</button></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>ID</th><th>Subject</th><th>Level</th><th>Score</th><th>%</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>if(sessionStorage.getItem('admin')!=='1')location.href='admin-login.html';function render(){let h=JSON.parse(localStorage.getItem('quizResults')||'[]');a.textContent=h.length;st.textContent=new Set(h.map(x=>x.id)).size;av.textContent=h.length?Math.round(h.reduce((s,x)=>s+x.pct,0)/h.length)+'%':'0%';rows.innerHTML=h.length?h.map(x=>`<tr><td>${x.name}</td><td>${x.id}</td><td>${x.subject}</td><td>${x.difficulty}</td><td>${x.correct}/${x.total}</td><td>${x.pct}%</td><td>${x.date}</td></tr>`).join(''):'<tr><td colspan="7">No attempts recorded.</td></tr>'}function wipe(){if(confirm('Delete all quiz results?')){localStorage.removeItem('quizResults');render()}}render()</script></body></html>

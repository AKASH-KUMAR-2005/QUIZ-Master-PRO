<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attempt History</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="student-dashboard.html"><span>Q</span><b>QuizMaster <i>PRO</i></b></a><nav><a href="student-dashboard.html">Dashboard</a></nav></header><main class="dash"><div class="panel"><div class="row between"><div><small class="tag">MY HISTORY</small><h1>Quiz Attempts</h1></div><button class="btn danger" onclick="clearMine()">Clear My History</button></div><div id="list"></div></div></main><script>let s=JSON.parse(localStorage.getItem('student')||'null');if(!s)location.href='student-login.html';function render(){let h=JSON.parse(localStorage.getItem('quizResults')||'[]').filter(x=>x.id===s.id);list.innerHTML=h.length?h.map(x=>`<div class="history"><div><b>${x.subject} • ${x.difficulty}</b><small>${x.date} • ${x.correct}/${x.total}</small></div><strong>${x.pct}%<small>Grade ${x.grade}</small></strong></div>`).join(''):'<p class="hint">No attempts yet.</p>'}function clearMine(){let h=JSON.parse(localStorage.getItem('quizResults')||'[]').filter(x=>x.id!==s.id);localStorage.setItem('quizResults',JSON.stringify(h));render()}render()</script></body></html>
